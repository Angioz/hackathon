<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Writers’ room</title><style>body{background:#10151e;color:#eef2f8;font:18px/1.55 system-ui;margin:0;padding:40px}header{max-width:1500px;margin:auto}h1{font-size:48px;margin:0}p{color:#aab8c8}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:1500px;margin:30px auto}.column{background:#192231;border-radius:18px;padding:24px}select{background:#263449;color:white;border:1px solid #52647c;padding:12px;font-size:17px;width:100%}.card{background:#202c3d;border-radius:12px;margin-top:14px;padding:18px}.twist{border:2px solid #ffbd69}.badge{display:inline-block;background:#354765;border-radius:30px;padding:3px 10px;font-size:14px}.why{color:#bdcad9}a{color:#8ad5c1}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style><header><a href="/">← Smart Scroll</a><h1>Inside the writers’ room</h1><p>Compare the decisions, reasoning and plot twists across two runs.</p></header><main class="grid"><section class="column"><select aria-label="First run"></select><div></div></section><section class="column"><select aria-label="Second run"></select><div></div></section></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function show(sel){let box=sel.nextElementSibling;if(!sel.value){box.textContent='No runs available yet.';return}try{let data=await (await fetch('/api/run?id='+encodeURIComponent(sel.value))).json();let log=Array.isArray(data.log)?data.log:(data.log.decisions||data.log.decision_log||data.log.entries||[]);box.innerHTML='<p>'+esc(data.story.title||data.story.feature_title||'Story decisions')+'</p>'+log.map(x=>`<article class="card ${x.plot_twist_flag?'twist':''}"><span class="badge">Round ${esc(x.round)}</span> <span class="badge">${esc(x.agent_id)}</span> <span class="badge">${esc(x.action_type)}</span>${x.plot_twist_flag?' <strong>✦ PLOT TWIST</strong>':''}<p>${esc(x.decision_summary||x.what)}</p><div class="why"><strong>Why:</strong> ${esc(x.reasoning_why||x.why)}</div></article>`).join('');if(!log.length)box.innerHTML+='<p>No decisions in this run.</p>'}catch{box.textContent='This run could not be read.'}}
fetch('/api/runs').then(r=>r.json()).then(runs=>document.querySelectorAll('select').forEach((s,i)=>{s.innerHTML=runs.length?runs.map(r=>`<option>${esc(r)}</option>`).join(''):'<option value="">No runs yet</option>';s.selectedIndex=Math.min(i,runs.length-1);s.onchange=()=>show(s);show(s)}));
</script></html>
